# The Fly app `fairfox` (C10): the app that exists, so the new server takes
# the address of the old one, fairfox.fly.dev. The image is not built by Fly:
# `devctl deploy` pushes the image `devctl image` built and deploys it with
# --image (C7, C8). DEPLOY.md lists every setting and where it is set (C3).
app = "fairfox"
primary_region = "ams"

[env]
  # The port the server listens on: the same number as internal_port below.
  FAIRFOX_PORT = "3000"
  # The database, on the volume mounted below. Litestream reads the same variable (C1).
  FAIRFOX_DATABASE_PATH = "/data/fairfox.db"
  # Not here: FAIRFOX_COMMIT, set by devctl deploy on each deploy; and
  # FAIRFOX_REPLICA_URL, a secret (fly secrets set).

[[mounts]]
  source = "fairfox_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/version"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
